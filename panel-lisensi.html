<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Lisensi ALEX STUDIO</title>
<style>
  body {
    font-family: 'Segoe UI', sans-serif;
    background: #0f0f0f;
    color: #eee;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
  }
  .card {
    background: #1a1a1a;
    padding: 30px;
    border-radius: 16px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 0 20px rgba(0,255,150,0.1);
  }
  h2 {
    text-align: center;
    color: #00ffaa;
    margin-bottom: 20px;
  }
  label {
    display: block;
    margin-top: 15px;
    font-size: 14px;
    color: #aaa;
  }
  input[type="text"], input[type="password"] {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    border-radius: 8px;
    border: 1px solid #333;
    background: #0f0f0f;
    color: #fff;
    box-sizing: border-box;
  }
  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 20px;
  }
  .switch {
    position: relative;
    width: 50px;
    height: 26px;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute;
    cursor: pointer;
    top: 0; left: 0; right: 0; bottom: 0;
    background-color: #444;
    border-radius: 26px;
    transition: .3s;
  }
  .slider:before {
    position: absolute;
    content: "";
    height: 20px; width: 20px;
    left: 3px; bottom: 3px;
    background-color: white;
    border-radius: 50%;
    transition: .3s;
  }
  input:checked + .slider { background-color: #00c853; }
  input:checked + .slider:before { transform: translateX(24px); }
  button {
    width: 100%;
    margin-top: 25px;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #00ffaa;
    color: #000;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
  }
  button:active { opacity: 0.8; }
  #status {
    margin-top: 15px;
    text-align: center;
    font-size: 14px;
    min-height: 20px;
  }
  .ok { color: #00ffaa; }
  .err { color: #ff5252; }
</style>
</head>
<body>

<div class="card">
  <h2>🔐 Panel Lisensi</h2>

  <label>URL Worker</label>
  <input type="text" id="workerUrl" placeholder="https://worker-kamu.workers.dev/set-license">

  <label>Nama Proyek</label>
  <input type="text" id="projectName" placeholder="Contoh: AlexDonateRobux">

  <div class="toggle-row">
    <span>Status Lunas</span>
    <label class="switch">
      <input type="checkbox" id="paidToggle">
      <span class="slider"></span>
    </label>
  </div>

  <label>Token Rahasia</label>
  <input type="password" id="secretToken" placeholder="Token rahasia Worker kamu">

  <button onclick="updateLicense()">Simpan Perubahan</button>

  <div id="status"></div>
</div>

<script>
async function updateLicense() {
  const url = document.getElementById('workerUrl').value.trim();
  const project = document.getElementById('projectName').value.trim();
  const paid = document.getElementById('paidToggle').checked;
  const secret = document.getElementById('secretToken').value.trim();
  const statusEl = document.getElementById('status');

  if (!url || !project || !secret) {
    statusEl.textContent = 'Semua kolom wajib diisi.';
    statusEl.className = 'err';
    return;
  }

  statusEl.textContent = 'Mengirim...';
  statusEl.className = '';

  try {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ project, paid, secret })
    });
    const data = await res.json();

    if (data.success) {
      statusEl.textContent = `Berhasil! "${project}" sekarang berstatus: ${paid ? 'LUNAS' : 'BELUM LUNAS'}`;
      statusEl.className = 'ok';
    } else {
      statusEl.textContent = 'Gagal: ' + (data.error || 'Tidak diketahui');
      statusEl.className = 'err';
    }
  } catch (e) {
    statusEl.textContent = 'Error koneksi: ' + e.message;
    statusEl.className = 'err';
  }
}
</script>

</body>
</html>
